<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!--
    Military eLearning — Font Aliases

    ฟอนต์ที่ติดตั้งจริงในระบบ:
      ราชการไทย : TH Sarabun New, TH SarabunPSK, TH Niramit AS, TH Srisakdi,
                   TH Baijam, TH K2D July8, TH KoHo, TH Kodchasal, TH Krub,
                   TH Mali Grade6, TH Charmonman, TH Chakra Petch, TH Fah kwang,
                   Chulabhorn Likit Text/Display
      TLWG Thai  : Loma, Waree, Kinnari, Norasi, Garuda, Laksaman, Umpush, ...
      Noto Thai  : Noto Sans Thai, Noto Serif Thai, Noto Looped Thai
      Latin      : Carlito (≡ Calibri), Caladea (≡ Cambria),
                   Liberation Sans/Serif/Mono (≡ Arial/TNR/Courier)
  -->

  <!-- ══ Latin / Western ══════════════════════════════════════════════ -->

  <!-- Calibri → Carlito  (metrically identical) -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Calibri</string></test>
    <edit name="family" mode="assign" binding="same"><string>Carlito</string></edit>
  </match>

  <!-- Cambria / Cambria Math → Caladea  (metrically identical) -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Cambria</string></test>
    <edit name="family" mode="assign" binding="same"><string>Caladea</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Cambria Math</string></test>
    <edit name="family" mode="assign" binding="same"><string>Caladea</string></edit>
  </match>

  <!-- Arial / Arial Narrow → Liberation Sans  (metrically identical) -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Arial Narrow</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans Narrow</string></edit>
  </match>

  <!-- Times New Roman → Liberation Serif  (metrically identical) -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Times New Roman</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Serif</string></edit>
  </match>

  <!-- Courier New → Liberation Mono  (metrically identical) -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Courier New</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Mono</string></edit>
  </match>

  <!-- Tahoma / Verdana / Trebuchet → Liberation Sans -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Tahoma</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Verdana</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Trebuchet MS</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit>
  </match>

  <!-- Georgia → Liberation Serif -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Georgia</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Serif</string></edit>
  </match>

  <!-- Comic Sans MS → DejaVu Sans -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Comic Sans MS</string></test>
    <edit name="family" mode="assign" binding="same"><string>DejaVu Sans</string></edit>
  </match>

  <!-- ══ Thai fonts: Windows names → ฟอนต์ราชการไทยที่ติดตั้งจริง ═══════
       TH Sarabun New  = ฟอนต์ราชการหลัก sans-serif
       TH SarabunPSK   = เวอร์ชันเก่า (มีในระบบแล้วเช่นกัน)
       TH Niramit AS   = ฟอนต์ราชการ serif
       TH Srisakdi     = ฟอนต์ราชการ sans round
  ════════════════════════════════════════════════════════════════════ -->

  <!-- Browallia New / BrowalliaUPC → TH Sarabun New -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Browallia New</string></test>
    <edit name="family" mode="assign" binding="same"><string>TH Sarabun New</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>BrowalliaUPC</string></test>
    <edit name="family" mode="assign" binding="same"><string>TH Sarabun New</string></edit>
  </match>

  <!-- Cordia New / CordiaUPC → TH Sarabun New -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Cordia New</string></test>
    <edit name="family" mode="assign" binding="same"><string>TH Sarabun New</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>CordiaUPC</string></test>
    <edit name="family" mode="assign" binding="same"><string>TH Sarabun New</string></edit>
  </match>

  <!-- AngsanaNew / AngsanaUPC → TH Niramit AS  (serif Thai) -->
  <match target="pattern">
    <test name="family" compare="eq"><string>AngsanaNew</string></test>
    <edit name="family" mode="assign" binding="same"><string>TH Niramit AS</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>AngsanaUPC</string></test>
    <edit name="family" mode="assign" binding="same"><string>TH Niramit AS</string></edit>
  </match>

  <!-- EucrosiaUPC → TH Sarabun New -->
  <match target="pattern">
    <test name="family" compare="eq"><string>EucrosiaUPC</string></test>
    <edit name="family" mode="assign" binding="same"><string>TH Sarabun New</string></edit>
  </match>

  <!-- FreesiaUPC → TH Sarabun New -->
  <match target="pattern">
    <test name="family" compare="eq"><string>FreesiaUPC</string></test>
    <edit name="family" mode="assign" binding="same"><string>TH Sarabun New</string></edit>
  </match>

  <!-- IrisUPC / JasmineUPC / KodchiangUPC → TH Sarabun New -->
  <match target="pattern">
    <test name="family" compare="eq"><string>IrisUPC</string></test>
    <edit name="family" mode="assign" binding="same"><string>TH Sarabun New</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>JasmineUPC</string></test>
    <edit name="family" mode="assign" binding="same"><string>TH Sarabun New</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>KodchiangUPC</string></test>
    <edit name="family" mode="assign" binding="same"><string>TH Sarabun New</string></edit>
  </match>

  <!-- LilyUPC / DilleniaUPC → TH Niramit AS -->
  <match target="pattern">
    <test name="family" compare="eq"><string>LilyUPC</string></test>
    <edit name="family" mode="assign" binding="same"><string>TH Niramit AS</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>DilleniaUPC</string></test>
    <edit name="family" mode="assign" binding="same"><string>TH Niramit AS</string></edit>
  </match>

  <!-- Leelawadee UI / Leelawadee → Noto Sans Thai -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Leelawadee UI</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans Thai</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Leelawadee</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans Thai</string></edit>
  </match>

</fontconfig>
