server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    client_max_body_size 0;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # วิดีโอ (เดิม) — Caddy strip /media/videos แล้ว ส่ง /{user}/{subject}/{file}
    # ไฟล์วิดีโอไม่เปลี่ยนแปลงหลังอัปโหลดแล้ว จึงแคชยาวได้อย่างปลอดภัย —
    # ช่วยลดโหลดซ้ำตอนนักเรียนเปิดดูซ้ำ/เลื่อนดูวิดีโอเดิม ลดภาระ CPU ช่วงพีค
    # mp4 module ทำให้ seek/เลื่อนดูวิดีโอมีประสิทธิภาพ (ส่ง byte-range ได้ถูกต้อง)
    location ~* \.mp4$ {
        root   /usr/share/nginx/html;
        mp4;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        root   /usr/share/nginx/html;
    }

    # เอกสาร/PDF — Caddy ส่ง /media/documents/{user}/{subject}/{file} (ไม่ strip)
    # แคชสั้นกว่าวิดีโอเพราะเอกสารมีโอกาสถูกแก้ไข/อัปโหลดทับได้บ่อยกว่า
    location /media/documents/ {
        alias  /usr/share/nginx/docs/;
        add_header Cache-Control "public, max-age=86400";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
