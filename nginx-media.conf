server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    client_max_body_size 0;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # วิดีโอ (เดิม) — Caddy strip /media/videos แล้ว ส่ง /{user}/{subject}/{file}
    # ไฟล์วิดีโอไม่เปลี่ยนแปลงหลังอัปโหลดแล้ว จึงแคชยาวได้อย่างปลอดภัย —
    # ช่วยลดโหลดซ้ำตอนนักเรียนเปิดดูซ้ำ/เลื่อนดูวิดีโอเดิม ลดภาระ CPU ช่วงพีค
    # mp4 module ทำให้ seek/เลื่อนดูวิดีโอมีประสิทธิภาพ (ส่ง byte-range ได้ถูกต้อง)
    #
    # ── CORS (ทุก location ในไฟล์นี้) ───────────────────────────────────────
    # ไฟล์พวกนี้ถูกฝังผ่าน <iframe>/<video>/<audio> จากหน้า Studio ซึ่งอยู่คนละ
    # origin (studio-signalstandard.rta.mi.th ต่างจาก signalstandard.rta.mi.th
    # ที่ serve ไฟล์นี้) — เบราว์เซอร์ (โดยเฉพาะ PDF viewer ของ Chrome ที่ทำ
    # cross-origin Range request แยกไปดึง embedded font/ข้อมูลบางส่วนของไฟล์)
    # จะบล็อก response ที่ไม่มี Access-Control-Allow-Origin เงียบๆ โดยไม่ error
    # ชัดเจน — เปิดหน้าตรงๆ (same-origin navigation) เลยดูปกติ แต่ฝังใน iframe
    # จากคนละ origin แล้วเนื้อหาบางส่วน (เช่น glyph ของฟอนต์) หายไป กลายเป็น
    # กล่องสี่เหลี่ยม (.notdef) ทั้งที่ไฟล์ต้นฉบับถูกต้องสมบูรณ์
    location ~* \.mp4$ {
        root   /usr/share/nginx/html;
        mp4;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;
    }

    location / {
        root   /usr/share/nginx/html;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;
    }

    # เอกสาร/PDF — Caddy ส่ง /media/documents/{user}/{subject}/{file} (ไม่ strip)
    # แคชสั้นกว่าวิดีโอเพราะเอกสารมีโอกาสถูกแก้ไข/อัปโหลดทับได้บ่อยกว่า
    location /media/documents/ {
        alias  /usr/share/nginx/docs/;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
