<div class="mil-pdf-studio">
  <input type="hidden" id="mil-csrf-token" value="{csrf_token}">
  <h3 style="color:#4A1A6B; margin-bottom:20px;">&#128196; ตั้งค่า PDF Viewer</h3>

  <div class="mil-field">
    <label for="mil-display-name">ชื่อเอกสาร</label>
    <input type="text" id="mil-display-name" value="{display_name}"
           placeholder="เช่น สไลด์บทที่ 1" />
  </div>

  <div class="mil-field">
    <label for="mil-pdf-url">URL ของไฟล์ PDF <span class="required">*</span></label>
    <input type="url" id="mil-pdf-url" value="{pdf_url}"
           placeholder="https://... หรือ /asset-v1:..." />
    <small>วางลิงก์จาก Files &amp; Uploads หรือ URL ภายนอก</small>
  </div>

  <div class="mil-field">
    <label for="mil-height">ความสูง (px)</label>
    <input type="number" id="mil-height" value="{height}" min="300" max="1200" />
    <small>แนะนำ 700 px</small>
  </div>

  <div class="mil-actions">
    <button class="mil-save-btn" id="mil-save">บันทึก</button>
    <button class="mil-cancel-btn" id="mil-cancel">ยกเลิก</button>
  </div>

  <p id="mil-error" class="mil-error" style="display:none;">กรุณากรอก URL ของไฟล์ PDF</p>
</div>
