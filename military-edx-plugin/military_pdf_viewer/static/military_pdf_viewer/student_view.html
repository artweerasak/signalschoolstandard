<div class="mil-pdf-wrapper" id="mil-pdf-{block_id}">
  <div class="mil-pdf-header">
    <span class="mil-pdf-title">{display_name}</span>
    <button class="mil-pdf-fullscreen-btn" onclick="milPdfFullscreen('mil-pdf-frame-{block_id}')">
      &#x26F6; เต็มหน้าจอ
    </button>
  </div>
  <div class="mil-pdf-body" style="height:{height}px">
    <iframe
      id="mil-pdf-frame-{block_id}"
      src="{pdf_url}"
      width="100%"
      height="100%"
      style="border:none; display:block;"
      allowfullscreen>
    </iframe>
  </div>
</div>
